name: Build and publish release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build APK and create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate tag and calculate Android version code
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          if [[ ! "$tag" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag must use Semantic Versioning, for example v0.2.0" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          version_code=$((major * 10000 + minor * 100 + patch))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "Calculated Android versionCode is invalid: $version_code" >&2
            exit 1
          fi
          echo "name=$tag" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew test

      - name: Build release APK
        run: >-
          ./gradlew assembleRelease
          -PreleaseVersion=${{ steps.version.outputs.name }}
          -PreleaseVersionCode=${{ steps.version.outputs.code }}

      - name: Rename APK with release version
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [[ -z "$apk" ]]; then
            echo "No release APK was produced" >&2
            exit 1
          fi
          cp "$apk" "VoiceJournal-${{ steps.version.outputs.name }}.apk"

      - name: Create private GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: VoiceJournal ${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: VoiceJournal-${{ steps.version.outputs.name }}.apk
